name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]

    # Throwaway PostgreSQL for the API/auth integration tests (the suite truncates its tables).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mds
          POSTGRES_PASSWORD: mds
          POSTGRES_DB: mds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mds -d mds_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://mds:mds@localhost:5432/mds_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build (client + server)
        run: npm run build

      - name: Run tests (engine + API/auth against PostgreSQL)
        run: npm test
