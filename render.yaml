# One-click hosting on Render (https://render.com): a web service running the Dockerfile and a PostgreSQL
# database. See docs/HOSTING.md. Free plans sleep when idle and Render's free databases expire; pick paid plans
# for anything players rely on.
services:
  - type: web
    name: missile-defense-simulator
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mds-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: COOKIE_SECURE
        value: '1'
databases:
  - name: mds-db
    plan: free
    databaseName: mds
    user: mds
